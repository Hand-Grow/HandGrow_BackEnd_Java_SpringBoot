spring:
  application:
    name: ${APP_NAME:handgrow-backend}
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  # Disable unused Redis autoconfiguration (Redis not used in this project)
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration

  # ===============================
  # 1. MONGODB CONFIGURATION
  # ===============================
  data:
    mongodb:
      uri: ${MONGO_URI}

  # ===============================
  # 2. DATABASE CONFIGURATION
  # ===============================
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/handgrow_db?prepareThreshold=0}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:password}
    driver-class-name: ${DB_DRIVER:org.postgresql.Driver}
    hikari:
      minimum-idle: 2
      maximum-pool-size: 10
      idle-timeout: 30000
      connection-timeout: 30000
      max-lifetime: 600000

  # ===============================
  # 3. JPA CONFIGURATION
  # ===============================
  jpa:
    # database-platform removed: Hibernate 6+ auto-detects PostgreSQL dialect (avoids HHH90000025 warning)
    open-in-view: false
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:none}
    show-sql: ${JPA_SHOW_SQL:true}
    properties:
      hibernate:
        format_sql: ${JPA_FORMAT_SQL:true}

# ===============================
# LOGGING CONFIGURATION
# ===============================
logging:
  level:
    root: WARN
    com.handgrow: ${LOG_LEVEL:INFO}
    org.springframework.web: WARN
    org.springframework.security: WARN
    org.springframework.boot.web: INFO
    org.springframework.boot.context.embedded: INFO
    # Suppress noisy MongoDB driver logs
    org.mongodb.driver: WARN
    # Suppress Hibernate SQL formatting logs (use show-sql in JPA config instead)
    org.hibernate.SQL: WARN
    org.hibernate.type.descriptor: WARN
    org.hibernate.orm.deprecation: ERROR
    # Suppress Flyway verbose migration logs
    org.flywaydb: INFO
    # Suppress verbose Hikari pool logs
    com.zaxxer.hikari: WARN
    # Suppress harmless Spring Security AuthenticationProvider warning
    org.springframework.security.config.annotation.authentication.configuration: ERROR

# ===============================
# 4. CUSTOM JWT CONFIGURATION
# ===============================
application:
  security:
    jwt:
      secret-key: ${JWT_SECRET_KEY:default-secret-key-change-in-production}
      expiration: ${JWT_EXPIRATION:86400000}
      refresh-token:
        expiration: ${JWT_REFRESH_EXPIRATION:604800000}

# ===============================
# 5. SERVER CONFIGURATION
# ===============================
server:
  port: ${PORT:8080}

# ===============================
# 6. MANAGEMENT CONFIGURATION
# ===============================
management:
  health:
    redis:
      enabled: false
    mongo:
      enabled: true

gemini:
  api:
    key: ${GEMINI_API_KEY:}
# ===============================
# 6. AWS CONFIGURATION
# ===============================
aws:
  credentials:
    access-key: ${AWS_ACCESS_KEY}
    secret-key: ${AWS_SECRET_KEY}
  s3:
    region: ${AWS_REGION}
    bucket-name: ${AWS_BUCKET_NAME}
