spring:
  application:
    name: ${APP_NAME:handgrow-backend}

  # ===============================
  # 1. REDIS CONFIGURATION
  # ===============================
  data:
    redis:
#      host: ${REDIS_HOST:localhost}
#      port: ${REDIS_PORT:6379}
#      password: ${REDIS_PASSWORD:}
#      database: ${REDIS_DATABASE:0}
#      timeout: ${REDIS_TIMEOUT:60000}ms

  # ===============================
  # 2. DATABASE CONFIGURATION
  # ===============================
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/handgrow_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:password}
    driver-class-name: ${DB_DRIVER:org.postgresql.Driver}
    hikari:
      minimum-idle: ${DB_MIN_IDLE:5}
      maximum-pool-size: ${DB_MAX_POOL_SIZE:20}
      idle-timeout: ${DB_IDLE_TIMEOUT:30000}
      max-lifetime: ${DB_MAX_LIFETIME:1800000}

  # ===============================
  # 3. JPA CONFIGURATION
  # ===============================
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    show-sql: ${JPA_SHOW_SQL:true}
    properties:
      hibernate:
        format_sql: ${JPA_FORMAT_SQL:true}

# ===============================
# 4. CUSTOM JWT CONFIGURATION
# ===============================
application:
  security:
    jwt:
      secret-key: ${JWT_SECRET_KEY:default-secret-key-change-in-production}
      expiration: ${JWT_EXPIRATION:86400000}
      refresh-token:
        expiration: ${JWT_REFRESH_EXPIRATION:604800000}

# ===============================
# 5. SERVER CONFIGURATION
# ===============================
server:
  port: ${PORT:8080}

# ===============================
# 6. MANAGEMENT CONFIGURATION
# ===============================
management:
  health:
    redis:
      enabled: false