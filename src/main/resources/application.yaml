spring:
  application:
    name: ${APP_NAME:handgrow-backend}
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  # ===============================
  # 1. REDIS CONFIGURATION
  # ===============================
  data:
    redis:
#      host: ${REDIS_HOST:localhost}
#      port: ${REDIS_PORT:6379}
#      password: ${REDIS_PASSWORD:}
#      database: ${REDIS_DATABASE:0}
#      timeout: ${REDIS_TIMEOUT:60000}ms
    mongodb:
      uri: ${MONGO_URI}

  # ===============================
  # 2. DATABASE CONFIGURATION
  # ===============================
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/handgrow_db?prepareThreshold=0}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:password}
    driver-class-name: ${DB_DRIVER:org.postgresql.Driver}
    hikari:
      minimum-idle: 2
      maximum-pool-size: 10
      idle-timeout: 30000
      connection-timeout: 30000
      max-lifetime: 600000

  # ===============================
  # 3. JPA CONFIGURATION
  # ===============================
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    show-sql: ${JPA_SHOW_SQL:true}
    properties:
      hibernate:
        format_sql: ${JPA_FORMAT_SQL:true}

# ===============================
# DEBUG CONFIGURATION  
# ===============================
logging:
  level:
    com.handgrow: ${LOG_LEVEL:INFO}
    org.springframework.boot.context.config: DEBUG

# ===============================
# 4. CUSTOM JWT CONFIGURATION
# ===============================
application:
  security:
    jwt:
      secret-key: ${JWT_SECRET_KEY:default-secret-key-change-in-production}
      expiration: ${JWT_EXPIRATION:86400000}
      refresh-token:
        expiration: ${JWT_REFRESH_EXPIRATION:604800000}

# ===============================
# 5. SERVER CONFIGURATION
# ===============================
server:
  port: ${PORT:8080}

# ===============================
# 6. MANAGEMENT CONFIGURATION
# ===============================
management:
  health:
    redis:
      enabled: false

gemini:
  api:
    key: ${GEMINI_API_KEY}
